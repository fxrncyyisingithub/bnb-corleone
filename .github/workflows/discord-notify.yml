name: Discord Notifications

on:
  push:
  pull_request:
    types: [opened, closed, reopened]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Push
        if: github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_GIT }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg msg "$(printf '%s' "$COMMIT_MSG" | head -n1)" \
            --arg author "$AUTHOR" \
            --arg sha "$(printf '%s' "$SHA" | cut -c1-7)" \
            --arg timestamp "$TIMESTAMP" \
            '{embeds: [{
               title: ("📦 Push su `" + $branch + "`"),
               description: ("**" + $msg + "**"),
               color: 3066993,
               fields: [
                 {name: "Author", value: $author, inline: true},
                 {name: "Commit", value: ("`" + $sha + "`"), inline: true}
               ],
               timestamp: $timestamp
             }]}')
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload"

      - name: Notify PR
        if: github.event_name == 'pull_request'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_GIT }}
          ACTION_TYPE: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          NUMBER: ${{ github.event.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$ACTION_TYPE" = "closed" ] && [ "$MERGED" = "true" ]; then
            COLOR=3066993; ICON="🔀"; ACTION="Merged"
          elif [ "$ACTION_TYPE" = "closed" ]; then
            COLOR=15158332; ICON="❌"; ACTION="Closed"
          else
            COLOR=3447003; ICON="📬"; ACTION="Opened"
          fi

          payload=$(jq -n \
            --arg title "$ICON PR #$NUMBER — $ACTION" \
            --arg prTitle "$TITLE" \
            --arg url "$URL" \
            --argjson color "$COLOR" \
            --arg branches "\`$HEAD_REF\` → \`$BASE_REF\`" \
            --arg login "$LOGIN" \
            '{embeds: [{
               title: $title,
               description: ("**" + $prTitle + "**\n[" + $url + "](" + $url + ")"),
               color: $color,
               fields: [
                 {name: "Branch", value: $branches, inline: true},
                 {name: "Author", value: $login, inline: true}
               ]
             }]}')
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload"

      - name: Notify Release
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_GIT }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          LOGIN: ${{ github.event.release.author.login }}
          URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg tag "$TAG" \
            --arg body "$(printf '%s' "$BODY" | head -c 200)" \
            --arg login "$LOGIN" \
            --arg url "$URL" \
            '{embeds: [{
               title: ("🏁 Release " + $tag),
               description: $body,
               color: 10181046,
               fields: [
                 {name: "Author", value: $login, inline: true},
                 {name: "URL", value: ("[" + $tag + "](" + $url + ")")}
               ]
             }]}')
          curl -s -X POST "$WEBHOOK" -H "Content-Type: application/json" -d "$payload"
